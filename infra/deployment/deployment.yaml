# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-manager-service-account
  namespace: ${NAMESPACE}
---
# Cluster Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-manager
rules:
- apiGroups: ["batch", ""]
  resources: ["jobs", "cronjobs", "secrets"]
  verbs: ["create", "delete", "update", "get", "list", "watch"]
---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-manager-binding
subjects:
- kind: ServiceAccount
  name: job-manager-service-account
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseterm-server
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browseterm-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: browseterm-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9999"
    spec:
      serviceAccountName: job-manager-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: browseterm-server
        image: ${REPO_NAME}/browseterm-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9999
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: CONTAINER_MAKER_HOST
          value: "${CONTAINER_MAKER_HOST}"
        - name: CONTAINER_MAKER_PORT
          value: "${CONTAINER_MAKER_PORT}"
        - name: CONTAINER_MAKER_CERTS_SECRET_NAME
          value: "${CONTAINER_MAKER_CERTS_SECRET_NAME}"
        - name: PAYMENT_GATEWAY_HOST
          value: "${PAYMENT_GATEWAY_HOST}"
        - name: PAYMENT_GATEWAY_PORT
          value: "${PAYMENT_GATEWAY_PORT}"
        - name: PAYMENT_GATEWAY_CERTS_SECRET_NAME
          value: "${PAYMENT_GATEWAY_CERTS_SECRET_NAME}"
        - name: NAMESPACE
          value: "${NAMESPACE}"
        - name: CERT_MANAGER_CRON_JOB_NAME
          value: ${CERT_MANAGER_CRON_JOB_NAME}
        - name: CERT_MANAGER_CRON_JOB_NAMESPACE
          value: ${NAMESPACE}
        - name: AUTH_REDIRECT_BASE_URI
          value: ${AUTH_REDIRECT_BASE_URI}
        - name: GOOGLE_CLIENT_ID
          value: ${GOOGLE_CLIENT_ID}
        - name: GOOGLE_CLIENT_SECRET
          value: ${GOOGLE_CLIENT_SECRET}
        - name: GITHUB_CLIENT_ID
          value: ${GITHUB_CLIENT_ID}
        - name: GITHUB_CLIENT_SECRET
          value: ${GITHUB_CLIENT_SECRET}
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: REDIS_USERNAME
          value: "${REDIS_USERNAME}"
        - name: REDIS_DB
          value: "${REDIS_DB}"
        # HOST/PORT are non-secret config (kept as literals). USER/PASSWORD/DB come from the
        # browseterm-db-credentials Secret (same Postgres creds the workload components use) so the
        # password is never templated into this manifest.
        - name: POSTGRES_HOST
          value: "${POSTGRES_HOST}"
        - name: POSTGRES_PORT
          value: "${POSTGRES_PORT}"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_DATABASE
        - name: SOCKET_SSH_WSS_URL
          value: "${SOCKET_SSH_WSS_URL}"
        - name: COOKIE_SECURE
          value: "${COOKIE_SECURE}"
        - name: COOKIE_SAMESITE
          value: "${COOKIE_SAMESITE}"
        livenessProbe:
          httpGet:
            path: /
            port: 9999
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 9999
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: browseterm-server-service
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server
spec:
  type: ClusterIP
  selector:
    app: browseterm-server
  ports:
  - name: http
    protocol: TCP
    port: 9999
    targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: browseterm-server-hpa
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: browseterm-server
  # Pinned to 1 for now: this all runs on a single 4-core/8GB dev VM, and multiple replicas
  # fighting the same node for resources (rather than adding real capacity) has repeatedly
  # made contention episodes worse, not better. Raise this once running on real multi-node
  # capacity.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: browseterm-server-pdb
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: browseterm-server
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browseterm-server-ingress
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: browseterm-server-service
            port:
              number: 9999
