# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-manager-service-account
  namespace: ${NAMESPACE}
---
# Cluster Role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: job-manager
rules:
- apiGroups: ["batch", ""]
  resources: ["jobs", "cronjobs", "secrets"]
  verbs: ["create", "delete", "update", "get", "list", "watch"]
---
# Cluster Role Binding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: job-manager-binding
subjects:
- kind: ServiceAccount
  name: job-manager-service-account
  namespace: ${NAMESPACE}
roleRef:
  kind: ClusterRole
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseterm-server-development
  namespace: ${NAMESPACE}
  labels:
    app: browseterm-server-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browseterm-server-development
  template:
    metadata:
      labels:
        app: browseterm-server-development
    spec:
      serviceAccountName: job-manager-service-account
      containers:
      - name: browseterm-server-development
        image: ${REPO_NAME}/browseterm-server-development:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9999
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: CONTAINER_MAKER_HOST
          value: "${CONTAINER_MAKER_DEVELOPMENT_HOST}"
        - name: CONTAINER_MAKER_PORT
          value: "${CONTAINER_MAKER_DEVELOPMENT_PORT}"
        - name: CONTAINER_MAKER_CERTS_SECRET_NAME
          value: "${CONTAINER_MAKER_CERTS_SECRET_NAME}"
        - name: PAYMENT_GATEWAY_HOST
          value: "${PAYMENT_GATEWAY_DEVELOPMENT_HOST}"
        - name: PAYMENT_GATEWAY_PORT
          value: "${PAYMENT_GATEWAY_DEVELOPMENT_PORT}"
        - name: PAYMENT_GATEWAY_CERTS_SECRET_NAME
          value: "${PAYMENT_GATEWAY_CERTS_SECRET_NAME}"
        - name: NAMESPACE
          value: "${NAMESPACE}"
        - name: CERT_MANAGER_CRON_JOB_NAME
          value: ${CERT_MANAGER_CRON_JOB_NAME}
        - name: CERT_MANAGER_CRON_JOB_NAMESPACE
          value: ${NAMESPACE}
        - name: AUTH_REDIRECT_BASE_URI
          value: ${AUTH_REDIRECT_BASE_URI}
        - name: GOOGLE_CLIENT_ID
          value: ${GOOGLE_CLIENT_ID}
        - name: GOOGLE_CLIENT_SECRET
          value: ${GOOGLE_CLIENT_SECRET}
        - name: GITHUB_CLIENT_ID
          value: ${GITHUB_CLIENT_ID}
        - name: GITHUB_CLIENT_SECRET
          value: ${GITHUB_CLIENT_SECRET}
        - name: REDIS_HOST
          value: "${REDIS_HOST}"
        - name: REDIS_PORT
          value: "${REDIS_PORT}"
        - name: REDIS_PASSWORD
          value: "${REDIS_PASSWORD}"
        - name: REDIS_USERNAME
          value: "${REDIS_USERNAME}"
        - name: REDIS_DB
          value: "${REDIS_DB}"
        # HOST/PORT are non-secret config (kept as literals). USER/PASSWORD/DB come from the
        # browseterm-db-credentials Secret (same Postgres creds the workload components use) so the
        # password is never templated into this manifest.
        - name: POSTGRES_HOST
          value: "${POSTGRES_HOST}"
        - name: POSTGRES_PORT
          value: "${POSTGRES_PORT}"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_USERNAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: browseterm-db-credentials
              key: DB_DATABASE
        - name: SOCKET_SSH_WSS_URL
          value: "${SOCKET_SSH_WSS_URL}"
        - name: COOKIE_SECURE
          value: "false"
        - name: COOKIE_SAMESITE
          value: "lax"
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        hostPath:
          path: ${HOSTPATH}
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: browseterm-server-development-service
  namespace: ${NAMESPACE}
spec:
  selector:
    app: browseterm-server-development
  ports:
    - protocol: TCP
      port: 9999
      targetPort: 9999
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browseterm-server-development-ingress
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: ${INGRESS_HOST}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: browseterm-server-development-service
            port:
              number: 9999
